# Render Blueprint for LifePulse AI — Pan-India Smart Blood Finder
# Deploy free static site or web service on Render

services:
  # Option 1: Static Site (Recommended - 100% Free, Instant Load)
  - type: web
    name: lifepulse-ai-static
    env: static
    buildCommand: ""
    staticPublishPath: ./
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate

