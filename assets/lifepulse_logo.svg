<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Rich Crimson Linear Gradient -->
    <linearGradient id="lpRedGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="45%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>

    <!-- Glossy Specular Highlight -->
    <linearGradient id="lpGlossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="lpSoftShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#DC2626" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Main Blood Droplet with 3D Depth -->
  <path d="M 60 12 C 60 12, 22 56, 22 80 C 22 101 39 116 60 116 C 81 116 98 101 98 80 C 98 56, 60 12, 60 12 Z" 
        fill="url(#lpRedGrad)" 
        filter="url(#lpSoftShadow)" />

  <!-- Inner Soft Radial Glow -->
  <path d="M 60 16 C 60 16, 26 58, 26 80 C 26 98 41 112 60 112 C 79 112 94 98 94 80 C 94 58, 60 16, 60 16 Z" 
        fill="url(#lpGlossGrad)" 
        opacity="0.35" />

  <!-- Left Curvature Specular Highlight -->
  <path d="M 58 24 C 58 24, 32 58, 30 78 C 29 88 34 98 42 104 C 34 98 32 86 35 76 C 39 60 58 24 58 24 Z" 
        fill="#ffffff" 
        opacity="0.45" />

  <!-- Heartbeat ECG Pulse Line (Crisp White with Pulse Wave) -->
  <path d="M 16 74 L 38 74 L 46 62 L 53 84 L 63 42 L 72 88 L 78 68 L 84 74 L 104 74" 
        stroke="#ffffff" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Medical Cross Accent (Top Right) -->
  <g transform="translate(68, 44)">
    <rect x="0" y="3" width="12" height="4" rx="2" fill="#ffffff" opacity="0.95" />
    <rect x="4" y="-1" width="4" height="12" rx="2" fill="#ffffff" opacity="0.95" />
  </g>
</svg>
